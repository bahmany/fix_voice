# Pocket TTS — Farsi (Persian), 6-layer distilled student.
#
#   uvx pocket-tts generate --config hf://mehdi-hf/pocket-tts-farsi/farsi.yaml \
#       --voice your_voice.wav --text "سلام، حال شما چطور است؟"
#
# weights_path carries both flow_lm.* and mimi.* tensors, so nothing else needs
# downloading -- in particular this does NOT depend on the gated kyutai/pocket-tts
# repo. Both paths are pinned to a commit so a later push cannot change what
# existing users get.
#
# Recommended generation settings: --cfg 1.0 (guidance is baked in by
# distillation), --temperature 0.3, --eos-threshold -2, --frames-after-eos 0.

weights_path: hf://mehdi-hf/pocket-tts-farsi/model.safetensors@9a6600f1c5125431ebb1a6d0adbaab18bf1f3eaa
default_temperature: 0.3


flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 4000
    tokenizer: sentencepiece
    tokenizer_path: hf://mehdi-hf/pocket-tts-farsi/tokenizer.model@9a6600f1c5125431ebb1a6d0adbaab18bf1f3eaa
  #weights_path: final.safetensors

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
  #weights_path: codec.safetensors
